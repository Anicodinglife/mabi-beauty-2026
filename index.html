<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2026 新瑪奇美容轉蛋圖鑑＆娜歐服行情筆記</title>
<style>
  :root {
    --bg: #0e1015;
    --surface: #161922;
    --surface-2: #1e2330;
    --border: #2a3040;
    --text: #eef1f7;
    --muted: #9aa3b8;
    --accent: #7c9cff;
    --accent-soft: rgba(124, 156, 255, 0.16);
    --t0: #ff6b8b;
    --t1: #ffb347;
    --t2: #5cc8ff;
    --t3: #8fe3a2;
    --gold: #ffd479;
    --my: #34d399;
    --my-soft: rgba(52, 211, 153, 0.14);
    --warn: #fbbf24;
    --danger: #f87171;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  }
  body.light {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface-2: #edf1f8;
    --border: #dce2ee;
    --text: #1b2232;
    --muted: #5d677d;
    --accent: #3d63e6;
    --accent-soft: rgba(61, 99, 230, 0.1);
    --gold: #b56f00;
    --my: #059669;
    --my-soft: rgba(5, 150, 105, 0.1);
    --warn: #b45309;
    --danger: #dc2626;
    --shadow: 0 10px 28px rgba(24, 39, 75, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px 130px; }
  header {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: clamp(1.25rem, 3.2vw, 1.7rem); letter-spacing: -0.02em; }
  .subtitle { color: var(--muted); font-size: 0.86rem; margin-top: 4px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); border-radius: 10px;
    padding: 7px 12px; font-size: 0.85rem; transition: all 0.15s ease;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  button.btn-primary:hover { filter: brightness(1.08); }
  button.btn-my { background: var(--my-soft); color: var(--my); border-color: rgba(52, 211, 153, 0.45); font-weight: 600; }

  .shared-banner {
    display: none;
    background: rgba(124, 156, 255, 0.14);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 0.86rem;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .shared-banner.show { display: flex; }

  .info-banner {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 12px 14px; font-size: 0.84rem; color: var(--muted);
    margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .info-banner strong { color: var(--text); }
  .rate-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding-top: 8px; border-top: 1px dashed var(--border); font-size: 0.82rem;
  }
  .rate-input {
    width: 82px; padding: 4px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font: inherit; font-weight: 700; text-align: right; outline: none;
  }
  .rate-input:focus { border-color: var(--accent); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search-input, .select-box {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 11px; font-size: 0.85rem; outline: none;
  }
  .search-input { width: 200px; }
  .search-input:focus, .select-box:focus { border-color: var(--accent); }

  /* Carousel View */
  .carousel-shell {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .stage {
    position: relative; background: #000; display: flex; align-items: center; justify-content: center;
    min-height: 300px; max-height: 520px; overflow: hidden; user-select: none; touch-action: pan-y;
  }
  .stage img {
    width: 100%; max-height: 500px; object-fit: contain; display: block; cursor: zoom-in;
  }
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.22);
    background: rgba(15, 18, 26, 0.72); color: #fff; font-size: 1.25rem;
    display: flex; align-items: center; justify-content: center; padding: 0;
    backdrop-filter: blur(6px);
  }
  .nav-btn:hover { background: var(--accent); border-color: var(--accent); }
  .nav-prev { left: 12px; }
  .nav-next { right: 12px; }
  .stage-counter {
    position: absolute; bottom: 10px; right: 12px;
    background: rgba(15, 18, 26, 0.78); color: #fff; font-size: 0.78rem;
    padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16);
  }
  .stage-hint {
    position: absolute; bottom: 10px; left: 12px;
    background: rgba(15, 18, 26, 0.72); color: #cbd5e1; font-size: 0.75rem;
    padding: 4px 10px; border-radius: 999px;
  }

  .detail-panel { padding: 16px 18px; display: grid; gap: 12px; }
  .detail-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .title-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .detail-title { font-size: 1.2rem; font-weight: 700; margin: 0; }
  .badge {
    display: inline-flex; align-items: center; font-size: 0.74rem; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em;
  }
  .badge-T0 { background: rgba(255, 107, 139, 0.2); color: var(--t0); border: 1px solid rgba(255, 107, 139, 0.4); }
  .badge-T1 { background: rgba(255, 179, 71, 0.2); color: var(--t1); border: 1px solid rgba(255, 179, 71, 0.4); }
  .badge-T2 { background: rgba(92, 200, 255, 0.2); color: var(--t2); border: 1px solid rgba(92, 200, 255, 0.4); }
  .badge-T3 { background: rgba(143, 227, 162, 0.2); color: var(--t3); border: 1px solid rgba(143, 227, 162, 0.4); }
  .badge-cat { background: var(--accent-soft); color: var(--accent); }

  .price-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px;
  }
  .price-box {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  .price-box.my-box {
    border-color: rgba(52, 211, 153, 0.45);
    background: linear-gradient(180deg, var(--my-soft), var(--surface-2));
  }
  .price-label { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .price-val { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
  .price-nao { color: var(--gold); }
  .price-sub { font-size: 0.74rem; color: var(--muted); margin-top: 3px; min-height: 1.1em; }
  .price-sub .ok { color: var(--my); font-weight: 600; }
  .price-sub .low { color: var(--t2); font-weight: 600; }
  .price-sub .high { color: var(--warn); font-weight: 600; }

  .my-input-row {
    display: flex; align-items: center; gap: 6px; margin-top: 5px;
  }
  .my-num {
    flex: 1; min-width: 0; padding: 5px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--my);
    font: inherit; font-weight: 700; font-size: 0.95rem; outline: none;
  }
  .my-num:focus { border-color: var(--my); }
  .my-unit {
    padding: 5px 6px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; font-size: 0.84rem; outline: none;
  }
  .my-clear {
    padding: 4px 8px; border-radius: 8px; font-size: 0.78rem; color: var(--muted);
    background: transparent; border: 1px solid var(--border);
  }
  .my-clear:hover { color: var(--danger); border-color: var(--danger); }

  .orig-names { font-size: 0.82rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .note-text { font-size: 0.9rem; margin: 0; }

  .pick-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick-btn.picked-self { background: #22c55e; border-color: #22c55e; color: #fff; font-weight: 600; }
  .pick-btn.picked-invest { background: #f59e0b; border-color: #f59e0b; color: #111; font-weight: 600; }

  .thumbs {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 14px;
    border-top: 1px solid var(--border); background: var(--surface-2);
    scrollbar-width: thin;
  }
  .thumb {
    flex: 0 0 auto; width: 92px; border-radius: 8px; overflow: hidden;
    border: 2px solid transparent; background: #000; cursor: pointer; position: relative;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .thumb img { width: 100%; height: 64px; object-fit: cover; display: block; }
  .thumb .t-cap {
    font-size: 0.68rem; color: #e2e8f0; background: rgba(0,0,0,0.78);
    padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb.active { border-color: var(--accent); transform: translateY(-2px); }
  .thumb .t-dot {
    position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%;
  }
  .t-dot.self { background: #22c55e; box-shadow: 0 0 0 2px #000; }
  .t-dot.invest { background: #f59e0b; box-shadow: 0 0 0 2px #000; }
  .thumb .t-price-tag {
    position: absolute; top: 4px; left: 4px;
    background: rgba(5, 150, 105, 0.92); color: #fff;
    font-size: 0.62rem; font-weight: 700; padding: 1px 5px; border-radius: 999px;
  }

  /* Grid View */
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-img-wrap { background: #000; position: relative; cursor: pointer; }
  .card-img-wrap img { width: 100%; aspect-ratio: 7 / 5; object-fit: contain; display: block; }
  .card-my-pill {
    position: absolute; top: 8px; right: 8px;
    background: rgba(5, 150, 105, 0.92); color: #fff;
    font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .card-body { padding: 11px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .card-title { font-weight: 700; font-size: 0.94rem; }
  .card-prices { font-size: 0.79rem; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .card-prices .nao { color: var(--gold); font-weight: 700; }
  .card-note { font-size: 0.78rem; color: var(--muted); flex: 1; }
  .card-my-editor {
    display: flex; align-items: center; gap: 5px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px;
  }
  .card-my-editor span { font-size: 0.73rem; color: var(--my); font-weight: 600; white-space: nowrap; }
  .card-my-editor input {
    flex: 1; min-width: 0; border: none; background: transparent; color: var(--text);
    font: inherit; font-size: 0.82rem; font-weight: 700; outline: none; text-align: right;
  }
  .card-my-editor select {
    border: none; background: var(--surface); color: var(--text); border-radius: 6px;
    font-size: 0.75rem; padding: 2px 4px; outline: none;
  }
  .card-actions { display: flex; gap: 6px; margin-top: 2px; }
  .card-actions button { flex: 1; padding: 5px 6px; font-size: 0.76rem; }

  /* Table (Reruns) */
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow-x: auto; box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--surface-2); color: var(--muted); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  /* Floating Checklist Bar */
  .dock {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: min(95vw, 920px); background: var(--surface); border: 1px solid var(--accent);
    border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    z-index: 40; font-size: 0.83rem;
  }
  .dock.hidden { display: none; }
  .dock-stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .dock-total { color: var(--gold); font-weight: 700; }
  .dock-nt { color: var(--my); font-weight: 700; }
  .dock-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .dock-btns button { padding: 6px 10px; font-size: 0.8rem; }

  /* Toast */
  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: #111827; color: #fff; border: 1px solid var(--accent);
    padding: 9px 16px; border-radius: 999px; font-size: 0.84rem;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; z-index: 120;
    max-width: 92vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.16);
    color: #fff; border: none; font-size: 1.1rem; padding: 8px 14px; border-radius: 999px;
  }

  .empty {
    text-align: center; padding: 48px 16px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  @media (max-width: 640px) {
    .search-input { width: 100%; }
    .stage-hint { display: none; }
    .nav-btn { width: 36px; height: 36px; font-size: 1rem; }
    .dock { padding: 9px 11px; gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>2026 新瑪奇美容轉蛋圖鑑＆娜歐服行情筆記</h1>
      <div class="subtitle">Get It Beauty 2026｜46 款重點新品實裝預覽（支援左右滑動・個人預測價試算・一鍵分享）</div>
    </div>
    <div class="top-actions">
      <button id="btnModeCarousel" class="active" type="button">輪播模式</button>
      <button id="btnModeGrid" type="button">總覽格狀</button>
      <button id="btnTheme" type="button">切換淺色</button>
    </div>
  </header>

  <div class="shared-banner" id="sharedBanner">
    <div id="sharedBannerText">📌 你正在檢視朋友分享的估價版本（不會覆蓋你原本存的資料）</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button id="btnApplyShared" class="btn-primary" type="button">套用成我的版本</button>
      <button id="btnExitShared" type="button">返回我的版本</button>
    </div>
  </div>

  <div class="info-banner">
    <div>
      <strong>娜歐服預估基準（2026/11）：</strong>
      依等值購買力換算約為<strong>韓服金幣價 × 0.55～0.75</strong>（下緣為開箱跳水期、上緣為停賣 3～6 個月後）。
      每張券皆可自填<strong>「個人預測金額」</strong>，系統會自動保存在你的瀏覽器，並優先以你的估價計算總預算。
    </div>
    <div class="rate-bar">
      <span><strong>台幣換算比值：</strong>1 億瑪幣 ≈ NT</span>
      <input id="rateInput" class="rate-input" type="number" min="100" step="50" inputmode="numeric" value="1500" aria-label="每億瑪幣對應台幣" />
      <span>元（可依最新幣值自調，自動換算預算）</span>
    </div>
  </div>

  <div class="controls">
    <div class="tabs" id="catTabs">
      <button data-cat="all" class="active" type="button">全部 (46)</button>
      <button data-cat="female" type="button">女髮 (15)</button>
      <button data-cat="male" type="button">男髮 (11)</button>
      <button data-cat="eye" type="button">異色瞳 (12)</button>
      <button data-cat="famo" type="button">臉型／嘴型 (8)</button>
      <button data-cat="picked" type="button">我的清單 (<span id="pickedTabCount">0</span>)</button>
      <button data-cat="rerun" type="button">高價復刻＆染劑</button>
    </div>
    <div class="filters" id="filterBar">
      <input id="searchInput" class="search-input" type="search" placeholder="搜尋中文／韓文／日文名..." />
      <select id="tierSelect" class="select-box">
        <option value="all">全部階層</option>
        <option value="T0">T0 頂級神券</option>
        <option value="T1">T1 一線高人氣</option>
        <option value="T2">T2 中高人氣</option>
        <option value="T3">T3 親民精選</option>
        <option value="priced">已填個人預測價</option>
      </select>
      <select id="sortSelect" class="select-box">
        <option value="priceDesc">參考價：高 → 低</option>
        <option value="priceAsc">參考價：低 → 高</option>
        <option value="myDesc">個人預測：高 → 低</option>
      </select>
    </div>
  </div>

  <main id="mainArea"></main>
</div>

<div class="dock hidden" id="dockBar">
  <div class="dock-stats">
    <span id="dockCounts"></span>
    <span>預估總預算：<span class="dock-total" id="sumNao">0</span> <span class="dock-nt" id="sumNt"></span></span>
  </div>
  <div class="dock-btns">
    <button id="btnViewPicked" type="button">只看清單</button>
    <button id="btnCopyText" class="btn-my" type="button">複製文字清單</button>
    <button id="btnShareLink" class="btn-primary" type="button">分享估價連結</button>
    <button id="btnClearAll" type="button">清空</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" type="button">關閉 ✕</button>
  <img id="lightboxImg" src="" alt="放大預覽" />

function safeReadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || "") || fallback; }
  catch (e) { return fallback; }
}
function safeReadRate() {
  try {
    const v = Number(localStorage.getItem(STORAGE_RATE));
    return v >= 100 && v <= 100000 ? v : 1500;
  } catch (e) { return 1500; }
}

// Base64URL encode/decode for compact ASCII share payloads
function encodeShare(obj) {
  const json = JSON.stringify(obj);
  return btoa(json).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeShare(str) {
  const pad = str.length % 4 ? "=".repeat(4 - (str.length % 4)) : "";
  const b64 = str.replace(/-/g, "+").replace(/_/g, "/") + pad;
  return JSON.parse(atob(b64));
}

function parseSharedHash() {
  const h = location.hash || "";
  if (!h.startsWith("#s=")) return null;
  try {
    const raw = decodeShare(h.slice(3));
    const picks = {};
    const myPrices = {};
    const validIds = new Set(ITEMS.map(x => x.id));
    if (raw && raw.p && typeof raw.p === "object") {
      for (const [k, v] of Object.entries(raw.p)) {
        if (!validIds.has(k)) continue;
        if (v === "s" || v === "self") picks[k] = "self";
        if (v === "i" || v === "invest") picks[k] = "invest";
      }
    }
    if (raw && raw.m && typeof raw.m === "object") {
      for (const [k, v] of Object.entries(raw.m)) {
        if (!validIds.has(k)) continue;
        const num = Number(v);
        if (Number.isFinite(num) && num > 0) myPrices[k] = num;
      }
    }
    const rate = Number(raw && raw.r);
    return {
      picks,
      myPrices,
      rate: Number.isFinite(rate) && rate >= 100 && rate <= 100000 ? rate : 1500
    };
  } catch (e) {
    return null;
  }
}

function persistLocal() {
  if (state.isSharedView) return;
  try {
    localStorage.setItem(STORAGE_PICKS, JSON.stringify(state.picks));
    localStorage.setItem(STORAGE_PRICES, JSON.stringify(state.myPrices));
    localStorage.setItem(STORAGE_RATE, String(state.rate));
  } catch (e) {}
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

async function copyText(text, successMsg) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      showToast(successMsg);
      return;
    }
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showToast(successMsg);
  } catch (e) {
    window.prompt("請手動複製以下內容：", text);
  }
  document.body.removeChild(ta);
}

function fmtGold(m) {
  if (m >= 100) {
    const yi = (m / 100).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
    return yi + " 億";
  }
  const wan = Math.round(m * 100);
  return wan.toLocaleString("zh-TW") + " 萬";
}
function fmtRange(minM, maxM) {
  return fmtGold(minM) + " ～ " + fmtGold(maxM);
}
function fmtNt(m) {
  const nt = Math.round((m / 100) * state.rate);
  return "NT " + nt.toLocaleString("zh-TW");
}
function fmtNtRange(minM, maxM) {
  if (Math.abs(minM - maxM) < 0.001) return "約 " + fmtNt(minM);
  return "約 " + fmtNt(minM) + "～" + Math.round((maxM / 100) * state.rate).toLocaleString("zh-TW");
}

// Helpers for unit conversion between internal "millions" (100 = 1億, 1 = 100萬) and UI input ("yi" or "wan")
function defaultUnitForItem(it, valM) {
  const ref = valM != null ? valM : it.naoMax;
  return ref >= 100 ? "yi" : "wan";
}
function millionsToInputVal(valM, unit) {
  if (valM == null || !Number.isFinite(valM) || valM <= 0) return "";
  if (unit === "yi") {
    return String(Number((valM / 100).toFixed(3)));
  }
  return String(Math.round(valM * 100));
}
function inputToMillions(rawStr, unit) {
  const s = String(rawStr || "").trim();
  if (!s) return null;
  const num = Number(s);
  if (!Number.isFinite(num) || num <= 0) return null;
  return unit === "yi" ? num * 100 : num / 100;
}

function buildDeltaHtml(it, valM) {
  if (valM == null) {
    return `留空時將以娜歐服參考價試算`;
  }
  const ntStr = `約 ${fmtNt(valM)}`;
  if (valM < it.naoMin) {
    const pct = Math.round(((it.naoMin - valM) / it.naoMin) * 100);
    return `${ntStr}・<span class="low">比參考下緣低 ${pct}%</span>`;
  }
  if (valM > it.naoMax) {
    const pct = Math.round(((valM - it.naoMax) / it.naoMax) * 100);
    return `${ntStr}・<span class="high">比參考上緣高 ${pct}%</span>`;
  }
  return `${ntStr}・<span class="ok">落在參考區間內</span>`;
}

function getFiltered() {
  let list = ITEMS.slice();
  if (state.cat === "picked") {
    list = list.filter(it => state.picks[it.id] || state.myPrices[it.id] != null);
  } else if (state.cat !== "all" && state.cat !== "rerun") {
    list = list.filter(it => it.cat === state.cat);
  }
  if (state.tier === "priced") {
    list = list.filter(it => state.myPrices[it.id] != null);
  } else if (state.tier !== "all") {
    list = list.filter(it => it.tier === state.tier);
  }
  const q = state.q.trim().toLowerCase();
  if (q) {
    list = list.filter(it =>
      it.zh.toLowerCase().includes(q) ||
      it.kr.toLowerCase().includes(q) ||
      it.jp.toLowerCase().includes(q) ||
      it.note.toLowerCase().includes(q)
    );
  }
  if (state.sort === "priceDesc") {
    list.sort((a, b) => b.krPrice - a.krPrice);
  } else if (state.sort === "priceAsc") {
    list.sort((a, b) => a.krPrice - b.krPrice);
  } else if (state.sort === "myDesc") {
    list.sort((a, b) => {
      const am = state.myPrices[a.id] != null ? state.myPrices[a.id] : -1;
      const bm = state.myPrices[b.id] != null ? state.myPrices[b.id] : -1;
      if (bm !== am) return bm - am;
      return b.krPrice - a.krPrice;
    });
  }
  return list;
}

function togglePick(id, kind) {
  if (state.picks[id] === kind) delete state.picks[id];
  else state.picks[id] = kind;
  persistLocal();
  updateDock();
  render();
}

function setMyPrice(id, valM, rerenderAll) {
  if (valM == null || !Number.isFinite(valM) || valM <= 0) {
    delete state.myPrices[id];
  } else {
    state.myPrices[id] = Math.round(valM * 1000) / 1000;
  }
  persistLocal();
  updateDock();
  if (rerenderAll) {
    render();
    return;
  }
  // Lightweight in-place DOM updates so typing never loses focus
  const it = ITEMS.find(x => x.id === id);
  const hint = document.getElementById("myDeltaHint");
  if (hint && it) hint.innerHTML = buildDeltaHtml(it, state.myPrices[id]);
  const thumb = document.querySelector(`.thumb[data-item-id="${id}"]`);
  if (thumb) {
    let tag = thumb.querySelector(".t-price-tag");
    if (state.myPrices[id] != null) {
      if (!tag) {
        tag = document.createElement("span");
        tag.className = "t-price-tag";
        thumb.appendChild(tag);
      }
      tag.textContent = fmtGold(state.myPrices[id]);
    } else if (tag) {
      tag.remove();
    }
  }
  const cardPill = document.querySelector(`.card-my-pill[data-pill-id="${id}"]`);
  if (cardPill) {
    if (state.myPrices[id] != null) {
      cardPill.textContent = "自估 " + fmtGold(state.myPrices[id]);
      cardPill.style.display = "inline-block";
    } else {
      cardPill.style.display = "none";
    }
  }
}

function updateDock() {
  let selfC = 0, invC = 0, myCnt = 0;
  let pickedMin = 0, pickedMax = 0, pickedCustom = 0;
  let onlyPricedSum = 0;
  let tabUnionCount = 0;

  for (const it of ITEMS) {
    const p = state.picks[it.id];
    const mp = state.myPrices[it.id];
    if (p || mp != null) tabUnionCount++;
    if (mp != null) {
      myCnt++;
      onlyPricedSum += mp;
    }
    if (p) {
      if (p === "self") selfC++;
      if (p === "invest") invC++;
      if (mp != null) {
        pickedMin += mp;
        pickedMax += mp;
        pickedCustom++;
      } else {
        pickedMin += it.naoMin;
        pickedMax += it.naoMax;
      }
    }
  }

  const pickedTotal = selfC + invC;
  document.getElementById("pickedTabCount").textContent = tabUnionCount;

  const hasAny = pickedTotal > 0 || myCnt > 0;
  document.getElementById("dockBar").classList.toggle("hidden", !hasAny);
  if (!hasAny) return;

  const countsParts = [];
  if (selfC > 0) countsParts.push(`自用 <strong>${selfC}</strong>`);
  if (invC > 0) countsParts.push(`投資 <strong>${invC}</strong>`);
  if (myCnt > 0) countsParts.push(`已自填估價 <strong style="color:var(--my)">${myCnt}</strong>`);
  document.getElementById("dockCounts").innerHTML = countsParts.join("・");

  if (pickedTotal > 0) {
    const isExact = Math.abs(pickedMin - pickedMax) < 0.001;
    const goldTxt = isExact ? fmtGold(pickedMin) : fmtRange(pickedMin, pickedMax);
    const suffix = pickedCustom > 0 && pickedCustom < pickedTotal ? "（含自估）" : (pickedCustom === pickedTotal ? "（全自估）" : "");
    document.getElementById("sumNao").textContent = goldTxt + suffix;
    document.getElementById("sumNt").textContent = "(" + fmtNtRange(pickedMin, pickedMax) + ")";
  } else {
    document.getElementById("sumNao").textContent = fmtGold(onlyPricedSum) + "（已填項目加總）";
    document.getElementById("sumNt").textContent = "(" + fmtNtRange(onlyPricedSum, onlyPricedSum) + ")";
  }
}

function buildShareText() {
  const selfItems = [];
  const invItems = [];
  const otherPriced = [];
  let minSum = 0, maxSum = 0;

  for (const it of ITEMS) {
    const p = state.picks[it.id];
    const mp = state.myPrices[it.id];
    const linePrice = mp != null
      ? `個人估 ${fmtGold(mp)}（參考 ${fmtRange(it.naoMin, it.naoMax)}）`
      : `參考 ${fmtRange(it.naoMin, it.naoMax)}`;
    if (p === "self") {
      selfItems.push(`・${it.zh}：${linePrice}`);
      minSum += mp != null ? mp : it.naoMin;
      maxSum += mp != null ? mp : it.naoMax;
    } else if (p === "invest") {
      invItems.push(`・${it.zh}：${linePrice}`);
      minSum += mp != null ? mp : it.naoMin;
      maxSum += mp != null ? mp : it.naoMax;
    } else if (mp != null) {
      otherPriced.push(`・${it.zh}：${linePrice}`);
    }
  }

  const lines = ["【2026 新瑪奇美容轉蛋・個人估價清單】"];
  if (selfItems.length) {
    lines.push("", "▸ 自用目標：", ...selfItems);
  }
  if (invItems.length) {
    lines.push("", "▸ 投資／囤貨目標：", ...invItems);
  }
  if (otherPriced.length) {
    lines.push("", "▸ 其他個人預測價：", ...otherPriced);
  }
  if (selfItems.length || invItems.length) {
    const goldSum = Math.abs(minSum - maxSum) < 0.001 ? fmtGold(minSum) : fmtRange(minSum, maxSum);
    lines.push("", `💰 清單預估總預算：${goldSum}（${fmtNtRange(minSum, maxSum)}｜比值 1 億 ≈ NT ${state.rate}）`);
  } else if (otherPriced.length) {
    const sum = Object.values(state.myPrices).reduce((a, b) => a + b, 0);
    lines.push("", `💰 已填預測總計：${fmtGold(sum)}（${fmtNtRange(sum, sum)}｜比值 1 億 ≈ NT ${state.rate}）`);
  }
  return lines.join("\n");
}

function buildShareUrl() {
  const p = {};
  for (const [k, v] of Object.entries(state.picks)) {
    p[k] = v === "self" ? "s" : "i";
  }
  const payload = { r: state.rate };
  if (Object.keys(p).length) payload.p = p;
  if (Object.keys(state.myPrices).length) payload.m = state.myPrices;
  const base = location.href.split("#")[0];
  return base + "#s=" + encodeShare(payload);
}

function renderReruns() {
  const rows = RERUNS.map(r => `
    <tr>
      <td><span class="badge badge-cat">${r.cat}</span></td>
      <td><strong>${r.zh}</strong></td>
      <td>${r.kr}</td>
      <td class="price-nao"><strong>${r.nao}</strong></td>
      <td style="color:var(--muted)">${r.note}</td>
    </tr>
  `).join("");
  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>類別</th><th>台服既有譯名／道具</th><th>韓服參考價</th><th>娜歐服預期參考價</th><th>備註</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderCarousel(list) {
  if (!list.length) return `<div class="empty">目前篩選條件下沒有符合的美容券。</div>`;
  if (state.idx >= list.length) state.idx = 0;
  if (state.idx < 0) state.idx = list.length - 1;
  const it = list[state.idx];
  const pick = state.picks[it.id] || "";
  const mp = state.myPrices[it.id];
  const unit = defaultUnitForItem(it, mp);
  const inputVal = millionsToInputVal(mp, unit);

  const thumbsHtml = list.map((x, i) => {
    const p = state.picks[x.id];
    const xm = state.myPrices[x.id];
    const dot = p ? `<span class="t-dot ${p}"></span>` : "";
    const tag = xm != null ? `<span class="t-price-tag">${fmtGold(xm)}</span>` : "";
    return `
      <div class="thumb ${i === state.idx ? "active" : ""}" data-idx="${i}" data-item-id="${x.id}" title="${x.zh}">
        ${tag}${dot}
        <img src="${x.dataUri}" alt="${x.zh}" loading="lazy" />
        <div class="t-cap">${x.zh}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="carousel-shell">
      <div class="stage" id="swipeStage">
        <button class="nav-btn nav-prev" id="btnPrev" type="button" aria-label="上一張">‹</button>
        <img id="stageImg" src="${it.dataUri}" alt="${it.zh}" />
        <button class="nav-btn nav-next" id="btnNext" type="button" aria-label="下一張">›</button>
        <div class="stage-hint">鍵盤 ← → 或左右滑動切換・點圖放大</div>
        <div class="stage-counter">${state.idx + 1} / ${list.length}</div>
      </div>
      <div class="detail-panel">
        <div class="detail-head">
          <div class="title-group">
            <span class="badge badge-${it.tier}">${it.tier}</span>
            <span class="badge badge-cat">${CAT_LABEL[it.cat]} #${it.rank}</span>
            <h2 class="detail-title">${it.zh}</h2>
          </div>
          <div class="pick-btns">
            <button class="pick-btn ${pick === "self" ? "picked-self" : ""}" data-pick="self" data-id="${it.id}" type="button">
              ${pick === "self" ? "✓ 已列自用" : "+ 列入自用"}
            </button>
            <button class="pick-btn ${pick === "invest" ? "picked-invest" : ""}" data-pick="invest" data-id="${it.id}" type="button">
              ${pick === "invest" ? "★ 已列投資" : "+ 列入投資"}
            </button>
          </div>
        </div>
        <div class="price-row">
          <div class="price-box">
            <div class="price-label">台灣娜歐服預期參考價</div>
            <div class="price-val price-nao">${fmtRange(it.naoMin, it.naoMax)}</div>
            <div class="price-sub">${fmtNtRange(it.naoMin, it.naoMax)}</div>
          </div>
          <div class="price-box">
            <div class="price-label">韓服拍賣場參考價（限交易 1 次）</div>
            <div class="price-val">約 ${fmtGold(it.krPrice)}</div>
            <div class="price-sub">韓服即時行情基準</div>
          </div>
          <div class="price-box my-box">
            <div class="price-label">
              <span style="color:var(--my);font-weight:700;">個人預測金額（自填）</span>
              <span style="font-size:0.7rem;">自動儲存</span>
            </div>
            <div class="my-input-row">
              <input id="myPriceInput" class="my-num" type="number" step="any" min="0" inputmode="decimal"
                     placeholder="輸入心裡價..." value="${inputVal}" data-id="${it.id}" />
              <select id="myPriceUnit" class="my-unit" aria-label="單位">
                <option value="yi" ${unit === "yi" ? "selected" : ""}>億</option>
                <option value="wan" ${unit === "wan" ? "selected" : ""}>萬</option>
              </select>
              <button id="myPriceClear" class="my-clear" type="button" title="清除個人預測">✕</button>
            </div>
            <div class="price-sub" id="myDeltaHint">${buildDeltaHtml(it, mp)}</div>
          </div>
        </div>
        <p class="note-text">${it.note}</p>
        <div class="orig-names">
          <span>韓文：${it.kr}</span>
          <span>日文：${it.jp}</span>
        </div>
      </div>
      <div class="thumbs" id="thumbStrip">${thumbsHtml}</div>
    </div>
  `;
}

function renderGrid(list) {
  if (!list.length) return `<div class="empty">目前篩選條件下沒有符合的美容券。</div>`;
  const cards = list.map((it, i) => {
    const pick = state.picks[it.id] || "";
    const mp = state.myPrices[it.id];
    const unit = defaultUnitForItem(it, mp);
    const inputVal = millionsToInputVal(mp, unit);
    const pillStyle = mp != null ? "inline-block" : "none";
    return `
      <article class="card">
        <div class="card-img-wrap" data-open-idx="${i}">
          <img src="${it.dataUri}" alt="${it.zh}" loading="lazy" />
          <span class="card-my-pill" data-pill-id="${it.id}" style="display:${pillStyle}">自估 ${mp != null ? fmtGold(mp) : ""}</span>
        </div>
        <div class="card-body">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <span class="badge badge-${it.tier}">${it.tier}</span>
            <span class="badge badge-cat">${CAT_LABEL[it.cat]}</span>
          </div>
          <div class="card-title">${it.zh}</div>
          <div class="card-prices">
            <span>韓服約 ${fmtGold(it.krPrice)}</span>
            <span class="nao">娜歐 ${fmtRange(it.naoMin, it.naoMax)}</span>
          </div>
          <div class="card-note">${it.note}</div>
          <div class="card-my-editor" data-card-editor="${it.id}">
            <span>個人估價</span>
            <input type="number" step="any" min="0" inputmode="decimal" placeholder="自填..."
                   value="${inputVal}" data-grid-price="${it.id}" />
            <select data-grid-unit="${it.id}" aria-label="單位">
              <option value="yi" ${unit === "yi" ? "selected" : ""}>億</option>
              <option value="wan" ${unit === "wan" ? "selected" : ""}>萬</option>
            </select>
          </div>
          <div class="card-actions">
            <button class="pick-btn ${pick === "self" ? "picked-self" : ""}" data-pick="self" data-id="${it.id}" type="button">
              ${pick === "self" ? "✓ 自用" : "+ 自用"}
            </button>
            <button class="pick-btn ${pick === "invest" ? "picked-invest" : ""}" data-pick="invest" data-id="${it.id}" type="button">
              ${pick === "invest" ? "★ 投資" : "+ 投資"}
            </button>
          </div>
        </div>
      </article>
    `;
  }).join("");
  return `<div class="grid">${cards}</div>`;
}

function render() {
  const main = document.getElementById("mainArea");
  const filterBar = document.getElementById("filterBar");
  if (state.cat === "rerun") {
    filterBar.style.display = "none";
    main.innerHTML = renderReruns();
    return;
  }
  filterBar.style.display = "flex";
  const list = getFiltered();
  main.innerHTML = state.mode === "carousel" ? renderCarousel(list) : renderGrid(list);

  // Bind carousel events
  if (state.mode === "carousel" && list.length) {
    const curItem = list[state.idx];
    document.getElementById("btnPrev").onclick = () => { state.idx = (state.idx - 1 + list.length) % list.length; render(); };
    document.getElementById("btnNext").onclick = () => { state.idx = (state.idx + 1) % list.length; render(); };
    document.getElementById("stageImg").onclick = () => openLightbox(curItem.dataUri);
    document.querySelectorAll(".thumb").forEach(el => {
      el.onclick = () => { state.idx = Number(el.dataset.idx); render(); };
    });
    const activeThumb = document.querySelector(".thumb.active");
    if (activeThumb) activeThumb.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });

    // Personal price editor in carousel
    const inp = document.getElementById("myPriceInput");
    const unitSel = document.getElementById("myPriceUnit");
    const clrBtn = document.getElementById("myPriceClear");
    if (inp && unitSel) {
      const applyVal = () => {
        const valM = inputToMillions(inp.value, unitSel.value);
        setMyPrice(curItem.id, valM, false);
      };
      inp.oninput = applyVal;
      unitSel.onchange = applyVal;
      clrBtn.onclick = () => {
        inp.value = "";
        setMyPrice(curItem.id, null, false);
      };
    }

    // Touch swipe
    const stage = document.getElementById("swipeStage");
    let sx = 0, sy = 0;
    stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    stage.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        state.idx = dx < 0 ? (state.idx + 1) % list.length : (state.idx - 1 + list.length) % list.length;
        render();
      }
    }, { passive: true });
  }

  // Bind grid card click -> jump to carousel at that item
  document.querySelectorAll("[data-open-idx]").forEach(el => {
    el.onclick = () => {
      state.idx = Number(el.dataset.openIdx);
      state.mode = "carousel";
      syncModeBtns();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
  });

  // Bind grid inline personal price editors
  document.querySelectorAll("[data-grid-price]").forEach(inp => {
    const id = inp.dataset.gridPrice;
    const unitSel = document.querySelector(`[data-grid-unit="${id}"]`);
    const applyGrid = () => {
      const valM = inputToMillions(inp.value, unitSel.value);
      setMyPrice(id, valM, false);
    };
    inp.oninput = applyGrid;
    unitSel.onchange = applyGrid;
  });

  // Bind pick buttons
  document.querySelectorAll("[data-pick]").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      togglePick(btn.dataset.id, btn.dataset.pick);
    };
  });
}

function syncModeBtns() {
  document.getElementById("btnModeCarousel").classList.toggle("active", state.mode === "carousel");
  document.getElementById("btnModeGrid").classList.toggle("active", state.mode === "grid");
}
function syncCatBtns() {
  document.querySelectorAll("#catTabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.cat === state.cat);
  });
}

function openLightbox(src) {
  document.getElementById("lightboxImg").src = src;
  document.getElementById("lightbox").classList.add("open");
}
document.getElementById("lightboxClose").onclick = () => document.getElementById("lightbox").classList.remove("open");
document.getElementById("lightbox").onclick = (e) => { if (e.target.id === "lightbox") e.currentTarget.classList.remove("open"); };

document.querySelectorAll("#catTabs button").forEach(btn => {
  btn.onclick = () => { state.cat = btn.dataset.cat; state.idx = 0; syncCatBtns(); render(); };
});
document.getElementById("btnModeCarousel").onclick = () => { state.mode = "carousel"; syncModeBtns(); render(); };
document.getElementById("btnModeGrid").onclick = () => { state.mode = "grid"; syncModeBtns(); render(); };
document.getElementById("searchInput").oninput = (e) => { state.q = e.target.value; state.idx = 0; render(); };
document.getElementById("tierSelect").onchange = (e) => { state.tier = e.target.value; state.idx = 0; render(); };
document.getElementById("sortSelect").onchange = (e) => { state.sort = e.target.value; state.idx = 0; render(); };
document.getElementById("btnTheme").onclick = (e) => {
  document.body.classList.toggle("light");
  e.target.textContent = document.body.classList.contains("light") ? "切換深色" : "切換淺色";
};

const rateInput = document.getElementById("rateInput");
rateInput.value = state.rate;
rateInput.oninput = (e) => {
  const v = Number(e.target.value);
  if (Number.isFinite(v) && v >= 100 && v <= 100000) {
    state.rate = v;
    persistLocal();
    updateDock();
    if (state.mode === "carousel" && state.cat !== "rerun") {
      const list = getFiltered();
      if (list.length) {
        const cur = list[state.idx];
        const hint = document.getElementById("myDeltaHint");
        if (hint && cur) hint.innerHTML = buildDeltaHtml(cur, state.myPrices[cur.id]);
        const naoSub = document.querySelector(".price-box .price-sub");
        if (naoSub && cur) naoSub.textContent = fmtNtRange(cur.naoMin, cur.naoMax);
      }
    }
  }
};

document.getElementById("btnViewPicked").onclick = () => { state.cat = "picked"; state.idx = 0; syncCatBtns(); render(); };
document.getElementById("btnCopyText").onclick = () => {
  copyText(buildShareText(), "已複製文字清單，可直接貼到 LINE / Discord！");
};
document.getElementById("btnShareLink").onclick = () => {
  copyText(buildShareUrl(), "已複製估價分享連結！朋友點開就能看你的版本");
};
document.getElementById("btnClearAll").onclick = () => {
  if (!window.confirm("確定要清空所有已選清單與個人預測金額嗎？")) return;
  state.picks = {};
  state.myPrices = {};
  persistLocal();
  updateDock();
  render();
  showToast("已清空清單與個人預測金額");
};

document.getElementById("btnApplyShared").onclick = () => {
  state.isSharedView = false;
  persistLocal();
  history.replaceState(null, "", location.href.split("#")[0]);
  updateSharedBanner();
  showToast("已套用並儲存為你的個人版本！");
};
document.getElementById("btnExitShared").onclick = () => {
  state.isSharedView = false;
  state.picks = safeReadJson(STORAGE_PICKS, {});
  state.myPrices = safeReadJson(STORAGE_PRICES, {});
  state.rate = safeReadRate();
  rateInput.value = state.rate;
  history.replaceState(null, "", location.href.split("#")[0]);
  updateSharedBanner();
  updateDock();
  render();
  showToast("已切回你原本儲存的版本");
};

document.addEventListener("keydown", e => {
  if (document.getElementById("lightbox").classList.contains("open")) {
    if (e.key === "Escape") document.getElementById("lightbox").classList.remove("open");
    return;
  }
  if (document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (state.mode === "carousel" && state.cat !== "rerun") {
    const list = getFiltered();
    if (!list.length) return;
    if (e.key === "ArrowLeft") { state.idx = (state.idx - 1 + list.length) % list.length; render(); }
    if (e.key === "ArrowRight") { state.idx = (state.idx + 1) % list.length; render(); }
  }
});

updateSharedBanner();
updateDock();
render();
</script>
</body>
</html>
